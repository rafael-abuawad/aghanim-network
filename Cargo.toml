[workspace]
resolver = "2"
members = ["crates/core", "crates/crypto", "crates/store", "crates/sync", "crates/wasm", "crates/relay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/rafael-abuawad/aghanim-network"

[workspace.dependencies]
aghanim-core = { path = "crates/core" }
aghanim-crypto = { path = "crates/crypto" }
aghanim-store = { path = "crates/store" }
aghanim-sync = { path = "crates/sync" }
blake3 = { version = "1.5", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize"] }
curve25519-dalek = { version = "4.1", default-features = false }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hex = "0.4"
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
